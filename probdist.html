<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Interactive Probability Distribution Teaching Tool</title><script src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js'></script><style>body{font-family:Segoe UI,Arial;margin:0;background:#f4f7fb;color:#172033}header{background:linear-gradient(135deg,#163d72,#2563eb);color:white;padding:28px}main{max-width:1400px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:18px;margin-bottom:18px}button{border:0;border-radius:8px;padding:9px;margin:3px;background:#2563eb;color:white;font-weight:600;cursor:pointer}.secondary{background:#e8eef7;color:#23436c}input,select{width:100%;padding:8px;margin:5px 0;border:1px solid #ccd6e2;border-radius:7px}.tabs{display:grid;grid-template-columns:1fr 1fr}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:12px;border:1px solid #dbe3ed;border-radius:10px}.stat span{font-size:12px;color:#667085}.stat b{display:block;font-size:22px}.chart{height:400px}.small{height:280px}.formula{background:#f5f7fa;padding:10px;border-radius:8px;font-family:Georgia;margin:8px 0}.answer{font-size:23px;color:#087f5b;font-weight:bold}.note{color:#667085;font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:right}td:first-child,th:first-child{text-align:left}@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><header><h1>🎲 Interactive Probability Distribution Teaching Tool</h1><p>Explore PMFs, PDFs, CDFs, probabilities, means and variances.</p></header><main><div class='grid'><aside><div class='card'><h2>Distribution</h2><div id='tabs' class='tabs'></div></div><div class='card'><h2>Parameters</h2><div id='controls'></div></div><div class='card'><h2>Probability Calculator</h2><div id='calc'></div><div id='ans'></div></div><div class='card'><h2>Teaching Formula</h2><div id='formula'></div></div></aside><section><div class='card'><h2 id='title'></h2><p id='desc' class='note'></p><div id='stats' class='stats'></div></div><div class='card'><h2>Distribution Graph</h2><div class='chart'><canvas id='plot'></canvas></div></div><div class='card'><h2>Cumulative Distribution Function</h2><div class='chart small'><canvas id='cdf'></canvas></div></div><div class='card'><h2>Interpretation</h2><div id='interpret'></div></div><div class='card'><h2>Probability Table</h2><div id='table'></div></div></section></div></main><script>
const D={Bernoulli:{t:'d',p:{p:.5},f:'X~Bernoulli(p) | E(X)=p | Var(X)=p(1-p)'},Binomial:{t:'d',p:{n:10,p:.5},f:'X~Bin(n,p) | P(X=x)=C(n,x)p^x(1-p)^(n-x) | E=np | Var=np(1-p)'},Poisson:{t:'d',p:{lambda:4},f:'X~Pois(λ) | P(X=x)=e^-λ λ^x/x! | E=λ | Var=λ'},Geometric:{t:'d',p:{p:.3},f:'P(X=x)=(1-p)^(x-1)p | E=1/p | Var=(1-p)/p²'},'Negative Binomial':{t:'d',p:{r:5,p:.4},f:'P(X=x)=C(x+r-1,x)p^r(1-p)^x'},Uniform:{t:'c',p:{a:0,b:10},f:'X~U(a,b) | f(x)=1/(b-a) | E=(a+b)/2 | Var=(b-a)²/12'},Normal:{t:'c',p:{mu:0,sigma:1},f:'X~N(μ,σ²) | E=μ | Var=σ²'},Exponential:{t:'c',p:{lambda:1},f:'X~Exp(λ) | f(x)=λe^-λx | E=1/λ | Var=1/λ²'},'t distribution':{t:'c',p:{df:5},f:'X~t(ν) | E=0 (ν>1) | Var=ν/(ν-2) (ν>2)'},'Chi-square':{t:'c',p:{df:5},f:'X~χ²(ν) | E=ν | Var=2ν'},F:{t:'c',p:{df1:5,df2:10},f:'X~F(ν₁,ν₂) | E=ν₂/(ν₂-2)'}};
let cur='Binomial',v=JSON.parse(JSON.stringify(D));let pc,cc;const $=id=>document.getElementById(id);function fmt(x){return Number.isFinite(x)?x.toFixed(4).replace(/\.?(0+)$/,''): '—'}function fact(n){let z=1;for(let i=2;i<=n;i++)z*=i;return z}function choose(n,k){if(k<0||k>n)return 0;let z=1;for(let i=1;i<=k;i++)z*=((n-k+i)/i);return z}function erf(x){let s=x<0?-1:1;x=Math.abs(x);let t=1/(1+.3275911*x);return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*Math.exp(-x*x))}function ncdf(x,m,s){return .5*(1+erf((x-m)/(s*Math.sqrt(2))))}
function pmf(x){let p=v[cur].p;switch(cur){case'Bernoulli':return x==1?p.p:1-p.p;case'Binomial':return choose(p.n,x)*p.p**x*(1-p.p)**(p.n-x);case'Poisson':return Math.exp(-p.lambda)*p.lambda**x/fact(x);case'Geometric':return x<1?0:(1-p.p)**(x-1)*p.p;case'Negative Binomial':return x<0?0:choose(x+p.r-1,x)*p.p**p.r*(1-p.p)**x}}function cdf(x){let p=v[cur].p;if(D[cur].t==='d'){let max=cur==='Binomial'?p.n:(cur==='Bernoulli'?1:cur==='Poisson'?Math.max(30,Math.ceil(p.lambda+8*Math.sqrt(p.lambda))):50),s=0;for(let i=0;i<=Math.min(Math.floor(x),max);i++)s+=pmf(i);return s}if(cur==='Normal')return ncdf(x,p.mu,p.sigma);if(cur==='Uniform')return x<=p.a?0:x>=p.b?1:(x-p.a)/(p.b-p.a);if(cur==='Exponential')return x<0?0:1-Math.exp(-p.lambda*x);if(cur==='t distribution')return ncdf(x,0,1);if(cur==='Chi-square')return 1-Math.exp(-x/2);return 1-Math.exp(-x)}function pdf(x){let p=v[cur].p;if(cur==='Uniform')return x>=p.a&&x<=p.b?1/(p.b-p.a):0;if(cur==='Normal')return Math.exp(-.5*((x-p.mu)/p.sigma)**2)/(p.sigma*Math.sqrt(2*Math.PI));if(cur==='Exponential')return x>=0?p.lambda*Math.exp(-p.lambda*x):0;if(cur==='Chi-square')return Math.exp(-x/2)*x**(p.df/2-1)/(2**(p.df/2));if(cur==='t distribution')return (1/Math.sqrt(Math.PI*p.df))*Math.exp(-(p.df+1)/2*Math.log(1+x*x/p.df));return Math.exp(-x*x/2)}
function render(){tabs();controls();calc();$('title').textContent=cur+' Distribution';$('desc').textContent=D[cur].desc||'Change the parameters and observe the distribution.';$('formula').innerHTML=D[cur].f;stats();graphs();table();interpret()}
function tabs(){$('tabs').innerHTML=Object.keys(D).map(k=>`<button class='${k==cur?'':'secondary'}' onclick="cur='${k}';render()">${k}</button>`).join('')}
function controls(){let p=v[cur].p;$('controls').innerHTML=Object.entries(p).map(([k,x])=>`<label>${k}</label><input type='number' step='${k=='p'?'0.01':'0.1'}' value='${x}' onchange="v[cur].p['${k}']=+this.value;render()">`).join('')}
function calc(){$('calc').innerHTML=D[cur].t==='d'?`<label>x</label><input id='x' type='number' value='1'><button onclick='dc()'>Calculate</button>`:`<label>a</label><input id='a' type='number' value='0'><label>b</label><input id='b' type='number' value='1'><button onclick='ccalc()'>Calculate P(a&lt;X&lt;b)</button>`}
function dc(){let x=+$('x').value,z=pmf(x),c=cdf(x);$('ans').innerHTML=`P(X=${x}) = <span class='answer'>${fmt(z)}</span><br>P(X≤${x}) = <b>${fmt(c)}</b><br>P(X>${x}) = <b>${fmt(1-c)}</b>`}function ccalc(){let a=+$('a').value,b=+$('b').value;if(a>b)[a,b]=[b,a];$('ans').innerHTML=`P(${a}&lt;X&lt;${b}) = <span class='answer'>${fmt(cdf(b)-cdf(a))}</span>`}
function moments(){let p=v[cur].p;if(cur==='Bernoulli')return[p.p,p.p*(1-p.p)];if(cur==='Binomial')return[p.n*p.p,p.n*p.p*(1-p.p)];if(cur==='Poisson')return[p.lambda,p.lambda];if(cur==='Geometric')return[1/p.p,(1-p.p)/p.p**2];if(cur==='Negative Binomial')return[p.r*(1-p.p)/p.p,p.r*(1-p.p)/p.p**2];if(cur==='Uniform')return[(p.a+p.b)/2,(p.b-p.a)**2/12];if(cur==='Normal')return[p.mu,p.sigma**2];if(cur==='Exponential')return[1/p.lambda,1/p.lambda**2];if(cur==='t distribution')return[0,p.df>2?p.df/(p.df-2):NaN];if(cur==='Chi-square')return[p.df,2*p.df];return[p.df2>2?p.df2/(p.df2-2):NaN,NaN]}
function stats(){let [m,va]=moments();$('stats').innerHTML=[['Mean',m],['Variance',va],['SD',Math.sqrt(va)],['Parameters',Object.values(v[cur].p).join(', ')]].map(x=>`<div class='stat'><span>${x[0]}</span><b>${typeof x[1]=='number'?fmt(x[1]):x[1]}</b></div>`).join('')}
function range(){let p=v[cur].p;if(D[cur].t==='d')return[0,cur==='Binomial'?p.n:cur==='Bernoulli'?1:cur==='Poisson'?Math.max(20,Math.ceil(p.lambda+5*Math.sqrt(p.lambda))):30];if(cur==='Normal')return[p.mu-4*p.sigma,p.mu+4*p.sigma];if(cur==='Uniform')return[p.a,p.b];if(cur==='Exponential')return[0,6/p.lambda];return[0,Math.max(15,p.df? p.df+10:10)]}
function graphs(){let [lo,hi]=range(),N=D[cur].t==='d'?hi-lo+1:180,x=[],y=[],z=[];for(let i=0;i<N;i++){let q=D[cur].t==='d'?lo+i:lo+(hi-lo)*i/(N-1);x.push(q);y.push(D[cur].t==='d'?pmf(q):pdf(q));z.push(cdf(q))}if(pc)pc.destroy();if(cc)cc.destroy();pc=new Chart($('plot'),{type:D[cur].t==='d'?'bar':'line',data:{labels:x.map(fmt),datasets:[{label:D[cur].t==='d'?'P(X=x)':'Density',data:y,borderWidth:2,fill:false}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true}}}});cc=new Chart($('cdf'),{type:'line',data:{labels:x.map(fmt),datasets:[{label:'F(x)=P(X≤x)',data:z,borderWidth:2,fill:false}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:1}}}})}
function table(){if(D[cur].t==='c'){$('table').innerHTML='<p class="note">Continuous variables have P(X=x)=0. Use interval probabilities.</p>';return}let [lo,hi]=range();let s='<table><tr><th>x</th><th>P(X=x)</th><th>P(X≤x)</th></tr>';for(let i=lo;i<=hi;i++)s+=`<tr><td>${i}</td><td>${fmt(pmf(i))}</td><td>${fmt(cdf(i))}</td></tr>`;$('table').innerHTML=s+'</table>'}function interpret(){let s=D[cur].t==='d'?'This is a <b>probability mass function</b>; the bars give probabilities and their total is 1.':'This is a <b>probability density function</b>; probabilities are areas under the curve, not heights.';$('interpret').innerHTML=s+' Change parameters and observe how the center and spread respond.'}render();
</script></body></html>
